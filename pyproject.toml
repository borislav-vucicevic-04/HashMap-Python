[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


# ==================================================
# PROJECT
# ==================================================

[project]
name = "hashmap"
version = "0.1.0"
description = "A strongly typed and feature-rich HashMap implementation for Python."
readme = "README.md"
requires-python = ">=3.12"

keywords = [
  "hashmap",
  "dictionary",
  "mapping",
  "collections",
  "data-structures",
  "typed",
  "generics",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

dependencies = []


# ==================================================
# OPTIONAL DEPENDENCIES
# ==================================================

[project.optional-dependencies]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.8",
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]


# ==================================================
# HATCH / BUILD
# ==================================================

[tool.hatch.build.targets.wheel]
packages = ["src/hashmap"]


[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/mkdocs.yml",
  "/pyproject.toml",
]


# ==================================================
# PYTEST
# ==================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
  "test_*.py",
]

python_classes = [
  "Test*",
]

python_functions = [
  "test_*",
]

addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]

filterwarnings = [
  "error",
]


# ==================================================
# COVERAGE
# ==================================================

[tool.coverage.run]
branch = true
source = ["hashmap"]


[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

exclude_lines = [
  "pragma: no cover",
  "@abstractmethod",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "raise NotImplementedError",
]


# ==================================================
# RUFF
# ==================================================

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
  "src",
  "tests",
]


[tool.ruff.lint]
select = [
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "N",
]

ignore = []


[tool.ruff.lint.isort]
known-first-party = ["hashmap"]


# ==================================================
# MYPY
# ==================================================

[tool.mypy]
python_version = "3.12"

strict = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

show_error_codes = true
show_column_numbers = true
pretty = true

files = [
  "src/hashmap",
  "tests",
]